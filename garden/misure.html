<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misure dell'orto</title>
<style>
:root{--bg:#f3f5ee;--fg:#22291d;--line:#c3cab8;--bed:#8f7252;--gravel:#cdc4b4}
@media (prefers-color-scheme:dark){:root{--bg:#171b14;--fg:#e8ecdf;--line:#414a39;--bed:#5e4632;--gravel:#8b8375;color-scheme:dark}}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;max-width:900px;margin:auto;padding:16px}
svg{display:block;width:100%;height:auto}
svg text{paint-order:stroke;stroke:var(--bg);stroke-width:3px;fill:var(--fg);font-size:9px;text-anchor:middle}
label{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:8px 0}
input{font:18px ui-monospace,monospace;width:72px;padding:8px;text-align:right}
</style>
<h1>Misure dell'orto</h1>
<svg id="svg" role="img" aria-label="Pianta quotata dell'orto"></svg>
<form id="form"></form>
<script>
// measured on 25 Nov 2026, in inches
const M=[['A','Dal bordo sinistro all\'aiuola 1',24],['L1','Aiuola 1, lunghezza',48],['B','Tra le aiuole 1 e 2',34],['L2','Aiuola 2, lunghezza',144],
['C','Tra le aiuole 2 e 3',25],['L3','Aiuola 3, lunghezza',48],['D','Dall\'aiuola 3 al bordo destro',24],['W','Aiuole, larghezza',48],['E','Lato prato, larghezza',24]];
const form=document.getElementById('form'),svg=document.getElementById('svg');
for(const[k,n,v]of M){const l=document.createElement('label');l.textContent=(k.length<2&&'ABCDE'.includes(k)?k+' · ':'')+n+' (in)';
 const i=document.createElement('input');i.id=k;i.type='number';i.min=1;i.value=v;l.append(i);form.append(l)}
const ft=x=>{x=Math.round(x*10)/10;const f=Math.floor(x/12),i=Math.round((x-f*12)*10)/10;return(f?f+'′':'')+(i||!f?String(i).replace('.',',')+'″':'')};
function draw(){
 const m={};for(const[k,,d]of M){const v=+document.getElementById(k).value;m[k]=v>0?v:d}
 const seq=['A','L1','B','L2','C','L3','D'].map(k=>m[k]),ed=[0];seq.forEach(v=>ed.push(ed.at(-1)+v));
 const len=ed[7],k=274/len,X=36,y0=8,px=v=>X+v*k,yB=y0+m.W*k,yE=yB+m.E*k,o=[],t=[];
 const R=(x,y,w,h,f)=>o.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--${f})" fill-opacity=".5" stroke="var(--fg)" stroke-width=".8"/>`);
 const L=(a,b,c,d,w)=>o.push(`<path d="M${a} ${b}L${c} ${d}" stroke="var(--fg)" stroke-width="${w}"/>`);
 const T=(x,y,s,r)=>t.push(`<text${y<yB&&!r?" style=\"stroke:none\"":""} x="${x}" y="${y}"${r?` transform="rotate(-90 ${x} ${y})"`:''}>${s}</text>`);
 const tick=(x,y)=>L(x-2.5,y+2.5,x+2.5,y-2.5,1.1);
 const hd=(a,b,y,s)=>{L(a,yE+2,a,y+3,.35);L(b,yE+2,b,y+3,.35);L(a,y,b,y,.6);tick(a,y);tick(b,y);T((a+b)/2,y-3,s)};
 const vd=(a,b,x,f,s)=>{const q=x<f?-1:1;L(f+2*q,a,x+3*q,a,.35);L(f+2*q,b,x+3*q,b,.35);L(x,a,x,b,.6);tick(x,a);tick(x,b);T(x-3,(a+b)/2,s,1)};
 R(X,y0,len*k,yE-y0,'gravel');
 [1,3,5].forEach((i,n)=>{R(px(ed[i]),y0,seq[i]*k,m.W*k,'bed');T(px(ed[i]+seq[i]/2),y0+m.W*k/2+3,n+1)});
 seq.forEach((v,i)=>hd(px(ed[i]),px(ed[i+1]),yE+16,ft(v)));hd(X,px(len),yE+36,ft(len));
 vd(y0,yB,X-10,X,ft(m.W));vd(yB,yE,X-10,X,ft(m.E));vd(y0,yE,X-24,X,ft(m.W+m.E));
 svg.setAttribute('viewBox',`0 0 340 ${Math.ceil(yE+42)}`);svg.innerHTML=o.concat(t).join('');
}
form.addEventListener('input',draw);form.addEventListener('submit',e=>e.preventDefault());draw();
</script>
</html>
